<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Dashboard | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">Company Dashboard</h2>
    <div id="alertBox"></div>
    <div class="row g-3 mb-4" id="statCards"></div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card section-card h-100">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-file-earmark-text me-2"></i>Requirement Status</h5>
            <div id="requirementsList"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card section-card h-100">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-megaphone me-2"></i>Message TPO Cell</h5>
            <form id="messageForm">
              <div class="mb-2">
                <input type="text" class="form-control" id="msgSubject" placeholder="Subject" required>
              </div>
              <div class="mb-2">
                <textarea class="form-control" id="msgBody" rows="3" placeholder="Message" required></textarea>
              </div>
              <button class="btn btn-primary-portal btn-sm" type="submit"><i class="bi bi-send me-1"></i>Send</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/company/dashboard.js"></script>
</body>
</html>
