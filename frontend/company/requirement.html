<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Requirement | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">Submit Placement Requirement</h2>
    <div id="alertBox"></div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card section-card">
          <div class="card-body">
            <form id="reqForm">
              <div class="mb-3">
                <label class="form-label">Job Title</label>
                <input type="text" class="form-control" id="jobTitle" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea class="form-control" id="jobDescription" rows="2"></textarea>
              </div>
              <div class="row g-2">
                <div class="col-md-6">
                  <label class="form-label">Job Type</label>
                  <select class="form-select" id="jobType">
                    <option>Full-Time</option><option>Internship</option><option>Internship + PPO</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Package (LPA)</label>
                  <input type="number" step="0.1" class="form-control" id="packageLPA" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Location</label>
                  <input type="text" class="form-control" id="location">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Application Deadline</label>
                  <input type="date" class="form-control" id="applicationDeadline" required>
                </div>
              </div>

              <hr class="my-3">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label mb-0 fw-bold">Proposed Recruitment Timetable</label>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addRoundRow()"><i class="bi bi-plus"></i> Add Round</button>
              </div>
              <div id="roundsContainer" class="mt-2"></div>

              <button type="submit" class="btn btn-primary-portal mt-3" id="submitBtn"><i class="bi bi-send me-1"></i>Submit Requirement</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card section-card">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-list-check me-2"></i>My Requirement Status</h5>
            <div id="reqList"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/company/requirement.js"></script>
</body>
</html>
