<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applicants | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-3 fw-bold text-primary-portal">Applicants & Shortlisted Candidates</h2>
    <div id="alertBox"></div>

    <div class="card section-card mb-3">
      <div class="card-body">
        <label class="form-label mb-1">Select Drive</label>
        <select class="form-select" id="driveSelect"></select>
      </div>
    </div>

    <ul class="nav nav-tabs mb-3" id="viewTabs">
      <li class="nav-item"><button class="nav-link active" data-view="all">All Applicants</button></li>
      <li class="nav-item"><button class="nav-link" data-view="selected">Final Selected</button></li>
    </ul>

    <div id="applicantsList"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/company/applicants.js"></script>
</body>
</html>
