<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruitment Feedback | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">Recruitment Feedback</h2>
    <div id="alertBox"></div>

    <div id="noAppSelected" class="d-none empty-state">
      <i class="bi bi-inbox" style="font-size:2.5rem;"></i>
      <p class="mt-2 mb-0">Select a candidate from the Applicants page to leave feedback.</p>
      <a href="applicants.html" class="btn btn-sm btn-outline-primary mt-2">Go to Applicants</a>
    </div>

    <div id="feedbackContent" class="d-none">
      <div class="card section-card mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between flex-wrap gap-2">
            <div>
              <h5 class="mb-0" id="candidateName"></h5>
              <div class="text-muted small" id="candidateMeta"></div>
            </div>
            <span class="badge-status badge" id="candidateStatus"></span>
          </div>
          <div class="stage-timeline my-3" id="stageTimeline"></div>
        </div>
      </div>

      <div class="card section-card">
        <div class="card-body">
          <h6 class="fw-bold mb-2"><i class="bi bi-chat-left-text me-1"></i>Feedback for Current Round</h6>
          <p class="text-muted small">Share interview feedback with the TPO Cell for this candidate's current round. The TPO Cell makes the official clear/reject decision.</p>
          <form id="feedbackForm">
            <textarea class="form-control mb-3" id="feedbackText" rows="4" placeholder="e.g. Strong problem solving, needs improvement in communication..."></textarea>
            <button type="submit" class="btn btn-primary-portal"><i class="bi bi-send me-1"></i>Save Feedback</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/company/feedback.js"></script>
</body>
</html>
