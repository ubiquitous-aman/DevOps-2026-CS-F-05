<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Profile | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">Company Profile</h2>
    <div id="alertBox"></div>

    <div class="card section-card">
      <div class="card-body">
        <form id="profileForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Company Name</label>
              <input type="text" class="form-control" id="companyName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Industry</label>
              <input type="text" class="form-control" id="industry">
            </div>
            <div class="col-md-6">
              <label class="form-label">Website</label>
              <input type="url" class="form-control" id="website">
            </div>
            <div class="col-md-6">
              <label class="form-label">Approval Status</label>
              <input type="text" class="form-control" id="approvalStatus" disabled>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="description" rows="3"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">HR Contact Name</label>
              <input type="text" class="form-control" id="hrName">
            </div>
            <div class="col-md-4">
              <label class="form-label">HR Phone</label>
              <input type="tel" class="form-control" id="hrPhone">
            </div>
            <div class="col-md-4">
              <label class="form-label">HR Email</label>
              <input type="email" class="form-control" id="hrEmail">
            </div>
          </div>
          <button type="submit" class="btn btn-primary-portal mt-3"><i class="bi bi-check2-circle me-1"></i>Save Changes</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/company/profile.js"></script>
</body>
</html>
