<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password | Placement Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-body">
        <div class="text-center mb-3">
          <a href="https://www.skit.ac.in" target="_blank" rel="noopener noreferrer"
            class="brand-badge d-inline-flex text-decoration-none"
            title="Visit SKIT Jaipur Official Website (www.skit.ac.in)">
            <img src="images/skit_logo.png" alt="SKIT Logo">
          </a>
          <h1 class="h4 fw-bold mb-1 text-primary">Set Your Password</h1>
          <p class="text-muted small mb-0">SKIT Jaipur · Complete your placement account setup</p>
        </div>

        <!-- Step indicators -->
        <div class="d-flex justify-content-center gap-2 mb-4">
          <span class="badge rounded-pill bg-success">1 ✓</span>
          <span class="badge rounded-pill bg-success">2 ✓</span>
          <span class="badge rounded-pill bg-primary">3</span>
        </div>

        <div id="alertBox"></div>

        <form id="setPasswordForm" novalidate>
          <div class="mb-2">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" minlength="8" required
                placeholder="At least 8 characters">
              <button class="btn btn-outline-secondary" type="button" id="togglePass" tabindex="-1">
                <i class="bi bi-eye" id="togglePassIcon"></i>
              </button>
            </div>
          </div>
          <!-- Password strength hints -->
          <div class="card bg-light p-2 mb-3 border-0 small" id="pwRulesCard">
            <div class="text-muted fw-semibold mb-1" style="font-size:0.75rem;">Password must contain:</div>
            <div class="row g-1" style="font-size:0.75rem;">
              <div class="col-6" id="ruleLen"><i class="bi bi-circle me-1"></i>8+ characters</div>
              <div class="col-6" id="ruleUpper"><i class="bi bi-circle me-1"></i>Uppercase (A-Z)</div>
              <div class="col-6" id="ruleLower"><i class="bi bi-circle me-1"></i>Lowercase (a-z)</div>
              <div class="col-6" id="ruleNum"><i class="bi bi-circle me-1"></i>Number (0-9)</div>
              <div class="col-12" id="ruleSpecial"><i class="bi bi-circle me-1"></i>Special character (!@#$%^&*)</div>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="confirmPassword" minlength="6" required
                placeholder="Re-enter your password">
              <button class="btn btn-outline-secondary" type="button" id="toggleConfirm" tabindex="-1">
                <i class="bi bi-eye" id="toggleConfirmIcon"></i>
              </button>
            </div>
            <div id="matchFeedback" class="form-text"></div>
          </div>

          <button type="submit" class="btn btn-primary-portal w-100 py-2" id="submitBtn">
            <span id="submitBtnText">Complete Registration</span>
            <span id="submitSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/set-password.js"></script>
</body>

</html>
