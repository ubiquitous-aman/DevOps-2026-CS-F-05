<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 id="pageTitle" class="fw-bold text-primary-portal mb-0">Manage Users</h2>
      <button class="btn btn-primary-portal btn-sm" data-bs-toggle="modal" data-bs-target="#newUserModal">
        <i class="bi bi-plus-circle me-1"></i>Add TPO / Company
      </button>
    </div>
    <div id="alertBox"></div>

    <!-- Role Filter Tabs -->
    <div class="card section-card mb-3">
      <div class="card-body pb-0">
        <div class="btn-group btn-group-sm mb-3" id="roleFilter">
          <button class="btn btn-outline-primary active" data-role="">All</button>
          <button class="btn btn-outline-primary" data-role="student">Students</button>
          <button class="btn btn-outline-primary" data-role="company">Companies</button>
          <button class="btn btn-outline-primary" data-role="tpo">TPO</button>
          <button class="btn btn-outline-primary" data-role="admin">Admin</button>
        </div>
      </div>
    </div>

    <!-- Student Filters (only visible when Students tab is active) -->
    <div class="card section-card mb-3 d-none" id="studentFiltersCard">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-sm-4">
            <label class="form-label small fw-semibold mb-1">Search</label>
            <input type="text" class="form-control form-control-sm" id="studentSearch" placeholder="Name or roll number&hellip;">
          </div>
          <div class="col-sm-3">
            <label class="form-label small fw-semibold mb-1">Branch</label>
            <select class="form-select form-select-sm" id="branchFilter">
              <option value="">All Branches</option>
              <option value="CSE">CSE</option>
              <option value="IT">IT</option>
              <option value="ECE">ECE</option>
              <option value="EE">EE</option>
              <option value="ME">ME</option>
              <option value="CE">CE</option>
              <option value="AI/ML">AI/ML</option>
              <option value="Data Science">Data Science</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label small fw-semibold mb-1">Placement Status</label>
            <select class="form-select form-select-sm" id="placementFilter">
              <option value="">All Statuses</option>
              <option value="Placed">Placed</option>
              <option value="Applied / In Process">Applied / In Process</option>
              <option value="Not Applied">Not Applied</option>
            </select>
          </div>
          <div class="col-sm-2">
            <label class="form-label small fw-semibold mb-1">Sort by</label>
            <select class="form-select form-select-sm" id="sortFilter">
              <option value="name">Name A&ndash;Z</option>
              <option value="cgpa">CGPA High&ndash;Low</option>
              <option value="batch">Batch</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle" id="usersTable">
            <thead id="usersTableHead">
              <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr>
            </thead>
            <tbody id="usersTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Create TPO / Company Modal -->
<div class="modal fade" id="newUserModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create TPO or Company Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="newUserAlert"></div>
        <form id="newUserForm">
          <div class="mb-2">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="nuName" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="nuEmail" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="nuPassword" minlength="6" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Role</label>
            <select class="form-select" id="nuRole" onchange="toggleCompanyFields()">
              <option value="tpo">TPO</option>
              <option value="company">Company</option>
            </select>
          </div>
          <!-- Company-specific fields (shown only when Role = Company) -->
          <div id="companyFields" class="d-none">
            <div class="mb-2">
              <label class="form-label">Company Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="nuCompanyName">
            </div>
            <div class="mb-2">
              <label class="form-label">Industry</label>
              <input type="text" class="form-control" id="nuIndustry" placeholder="e.g. Software, Finance, Core Engineering">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary-portal" id="createUserBtn" onclick="createUser()">Create</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/admin/users.js"></script>
</body>
</html>
