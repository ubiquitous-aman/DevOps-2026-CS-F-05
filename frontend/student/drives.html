<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Drives | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 id="pageTitle" class="fw-bold text-primary-portal mb-0">Placement Drives</h2>
      <div class="d-flex gap-2 flex-wrap">
        <input type="search" class="form-control form-control-sm" id="driveSearch" placeholder="Search company or role" style="width:210px;">
        <select class="form-select form-select-sm" id="driveSort" style="width:auto;">
          <option value="new">Newest first</option>
          <option value="deadline">Deadline (soonest)</option>
          <option value="package">Package (highest)</option>
        </select>
      </div>
      <div class="btn-group btn-group-sm" role="group" id="filterGroup">
        <button type="button" class="btn btn-outline-primary active" data-filter="all">All</button>
        <button type="button" class="btn btn-outline-primary" data-filter="eligible">Eligible Only</button>
        <button type="button" class="btn btn-outline-primary" data-filter="applied">Applied</button>
      </div>
    </div>
    <div id="alertBox"></div>
    <div id="drivesList" class="row g-3"></div>
  </main>
</div>

<!-- Apply confirmation modal -->
<div class="modal fade" id="applyModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Application</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="applyModalBody"></div>
        <div id="applyModalAlert" class="mt-2"></div>
        <form id="applyForm" novalidate class="mt-3">
          <div id="docLinksWrap" class="mb-3 d-none">
            <label class="form-label" for="documentLinks">Document links <span id="docLinksReq" class="text-danger"></span></label>
            <textarea class="form-control" id="documentLinks" rows="2" placeholder="One link per line (Google Drive, GitHub, portfolio...)"></textarea>
            <div class="form-text">Up to 5 links. Make sure they are shared with "anyone with the link".</div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="coverNote">Cover note (optional)</label>
            <textarea class="form-control" id="coverNote" rows="2" maxlength="500" placeholder="Why are you a good fit?"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary-portal" id="confirmApplyBtn">Apply Now</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/validate.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/student/drives.js"></script>
</body>
</html>
