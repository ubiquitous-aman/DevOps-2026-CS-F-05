<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">My Profile</h2>
    <div id="alertBox"></div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card section-card mb-3">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-person-lines-fill me-2"></i>Basic & Academic Information</h5>
            <form id="profileForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Roll Number</label>
                  <input type="text" class="form-control" id="rollNumber" disabled>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Branch</label>
                  <select class="form-select" id="branch">
                    <option>CSE</option><option>IT</option><option>ECE</option>
                    <option>EEE</option><option>ME</option><option>CE</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Batch (Year)</label>
                  <input type="number" class="form-control" id="batch">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone">
                </div>
                <div class="col-md-4">
                  <label class="form-label">10th %</label>
                  <input type="number" step="0.01" class="form-control" id="tenthPercentage">
                </div>
                <div class="col-md-4">
                  <label class="form-label">12th %</label>
                  <input type="number" step="0.01" class="form-control" id="twelfthPercentage">
                </div>
                <div class="col-md-4">
                  <label class="form-label">CGPA</label>
                  <input type="number" step="0.01" max="10" class="form-control" id="cgpa">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Active Backlogs</label>
                  <input type="number" class="form-control" id="activeBacklogs" value="0">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Skills (comma-separated)</label>
                  <input type="text" class="form-control" id="skills" placeholder="JavaScript, React, SQL">
                </div>
              </div>
              <button type="submit" class="btn btn-primary-portal mt-3" id="saveBtn">
                <i class="bi bi-check2-circle me-1"></i>Save Changes
              </button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card section-card mb-3">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-file-earmark-arrow-up me-2"></i>Resume</h5>
            <p class="text-muted small" id="currentResume">No resume uploaded yet.</p>
            <form id="resumeForm">
              <input type="file" class="form-control mb-3" id="resumeFile" accept=".pdf,.doc,.docx" required>
              <button type="submit" class="btn btn-outline-primary w-100" id="uploadBtn">
                <i class="bi bi-upload me-1"></i>Upload Resume
              </button>
            </form>
          </div>
        </div>

        <div class="card section-card">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-envelope me-2"></i>Account</h5>
            <p class="mb-1 small text-muted">Name</p>
            <p class="fw-semibold" id="acctName">—</p>
            <p class="mb-1 small text-muted">Email</p>
            <p class="fw-semibold" id="acctEmail">—</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/student/profile.js"></script>
</body>
</html>
