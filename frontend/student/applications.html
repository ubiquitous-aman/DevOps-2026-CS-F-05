<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 id="pageTitle" class="mb-0 fw-bold text-primary-portal">My Applications</h2>
      <button class="btn btn-sm btn-outline-primary" onclick="downloadFile('/student/calendar', 'placement-calendar.ics')" title="Deadlines and interview rounds, for Google / Outlook / phone calendars"><i class="bi bi-calendar-plus me-1"></i>Add to calendar (.ics)</button>
    </div>
    <div id="alertBox"></div>
    <div id="applicationsList"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/validate.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/student/applications.js"></script>
</body>
</html>
