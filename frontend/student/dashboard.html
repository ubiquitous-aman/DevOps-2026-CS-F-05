<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">Dashboard</h2>
    <div id="alertBox"></div>

    <div class="row g-3 mb-4" id="statCards">
      <!-- injected by dashboard.js -->
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card section-card h-100">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-briefcase me-2"></i>Recent Eligible Drives</h5>
            <div id="recentDrives"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card section-card h-100">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-bell me-2"></i>Recent Notifications</h5>
            <div id="recentNotifs"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/student/dashboard.js"></script>
</body>
</html>
