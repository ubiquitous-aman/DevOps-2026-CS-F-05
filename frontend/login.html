<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | College Placement Management Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-body">
        <a href="index.html" class="text-decoration-none small text-muted d-inline-flex align-items-center mb-2">
          <i class="bi bi-arrow-left me-1"></i>Back to home
        </a>
        <div class="text-center mb-3">
          <a href="https://www.skit.ac.in" target="_blank" rel="noopener noreferrer"
            class="brand-badge d-inline-flex text-decoration-none"
            title="Visit SKIT Jaipur Official Website (www.skit.ac.in)">
            <img src="images/skit_logo.png" alt="SKIT Logo">
          </a>
          <h1 class="h4 fw-bold mb-1 text-primary">SKIT Placement Portal</h1>
          <p class="text-muted small mb-0">Training &amp; Placement Cell · SKIT Jaipur</p>
        </div>

        <div id="alertBox"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="mb-2">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required
              minlength="6">
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <div class="text-end mb-3">
            <a href="forgot-password.html" class="small">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary-portal w-100 py-2" id="loginBtn">
            <span id="loginBtnText">Sign In</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </form>

        <hr class="my-4">

        <p class="text-center text-muted small mb-2">New here? Register as:</p>
        <div class="d-flex gap-2 role-pills justify-content-center flex-wrap">
          <a href="register-student.html" class="btn btn-outline-primary btn-sm"><i
              class="bi bi-person-badge me-1"></i>Student</a>
          <a href="register-company.html" class="btn btn-outline-secondary btn-sm"><i
              class="bi bi-building me-1"></i>Company</a>
        </div>
        <p class="text-center text-muted small mt-3 mb-0">
          TPO &amp; Admin accounts are provisioned by the system administrator.
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
