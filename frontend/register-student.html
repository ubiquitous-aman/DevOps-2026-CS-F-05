<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Placement Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="auth-wrapper">
    <div class="card auth-card" style="max-width:560px;">
      <div class="card-body">
        <a href="index.html" class="text-decoration-none small text-muted d-inline-flex align-items-center mb-2">
          <i class="bi bi-arrow-left me-1"></i>Back to home
        </a>
        <div class="text-center mb-3">
          <a href="https://www.skit.ac.in" target="_blank" rel="noopener noreferrer"
            class="brand-badge d-inline-flex text-decoration-none"
            title="Visit SKIT Jaipur Official Website (www.skit.ac.in)">
            <img src="images/skit_logo.png" alt="SKIT Logo">
          </a>
          <h1 class="h4 fw-bold mb-1 text-primary">Student Registration</h1>
          <p class="text-muted small mb-0">SKIT Jaipur · Training &amp; Placement Cell</p>
        </div>

        <div id="alertBox"></div>

        <form id="regForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Roll Number</label>
              <input type="text" class="form-control" id="rollNumber" required>
            </div>
            <div class="col-md-8">
              <label class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="phone">
            </div>
            <div class="col-md-5">
              <label class="form-label">Branch</label>
              <select class="form-select" id="branch" required>
                <option value="">Choose...</option>
                <option>CSE</option>
                <option>CSE(AI)</option>
                <option>CSE(DS)</option>
                <option>CSE(IoT)</option>
                <option>IT</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>ME</option>
                <option>CE</option>
              </select>
            </div>
            <div class="col-md-7">
              <label class="form-label">Batch (Graduation Year)</label>
              <input type="number" class="form-control" id="batch" min="2020" max="2035" value="2026" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-portal w-100 py-2 mt-4" id="regBtn">
            <span id="regBtnText">Send Verification Code</span>
            <span id="regSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/register-student.js"></script>
</body>

</html>
