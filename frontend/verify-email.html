<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | Placement Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-body">
        <a href="register-student.html"
          class="text-decoration-none small text-muted d-inline-flex align-items-center mb-2">
          <i class="bi bi-arrow-left me-1"></i>Back to registration
        </a>
        <div class="text-center mb-3">
          <a href="https://www.skit.ac.in" target="_blank" rel="noopener noreferrer"
            class="brand-badge d-inline-flex text-decoration-none"
            title="Visit SKIT Jaipur Official Website (www.skit.ac.in)">
            <img src="images/skit_logo.png" alt="SKIT Logo">
          </a>
          <h1 class="h4 fw-bold mb-1 text-primary">Verify Your College Email</h1>
          <p class="text-muted small mb-0" id="subtitle">SKIT Jaipur · Enter the 6-digit code sent to your email</p>
        </div>

        <!-- Step indicators -->
        <div class="d-flex justify-content-center gap-2 mb-4">
          <span class="badge rounded-pill bg-success">1 ✓</span>
          <span class="badge rounded-pill bg-primary">2</span>
          <span class="badge rounded-pill bg-secondary">3</span>
        </div>

        <div id="alertBox"></div>

        <form id="otpForm" novalidate>
          <p class="text-muted small text-center mb-3">
            We've sent a 6-digit code to <strong id="emailDisplay"></strong>.<br>
            <span class="text-muted" style="font-size:0.8rem;">
              Didn't receive it? Check your spam folder, or
              <span id="devHint" class="d-none">check the server console (dev mode, SMTP not configured).</span>
            </span>
          </p>

          <div class="mb-4">
            <label class="form-label">Verification Code</label>
            <input type="text" class="form-control text-center" id="otp" inputmode="numeric" maxlength="6"
              autocomplete="one-time-code" style="letter-spacing:10px;font-size:1.6rem;font-weight:600;"
              placeholder="------" required>
          </div>

          <button type="submit" class="btn btn-primary-portal w-100 py-2" id="verifyBtn">
            <span id="verifyBtnText">Verify &amp; Continue</span>
            <span id="verifySpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
          </button>
        </form>

        <!-- Resend section -->
        <div class="text-center mt-3">
          <button type="button" class="btn btn-link small p-0" id="resendBtn" disabled>
            Resend code <span id="resendCountdown"></span>
          </button>
        </div>

        <p class="text-center text-muted small mt-3 mb-0">
          Wrong email? <a href="register-student.html">Start over</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/verify-email.js"></script>
</body>

</html>
