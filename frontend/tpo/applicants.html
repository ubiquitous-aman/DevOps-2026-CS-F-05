<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applicants & Rounds | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-3 fw-bold text-primary-portal">Applicants & Recruitment Rounds</h2>
    <div id="alertBox"></div>

    <div class="card section-card mb-3">
      <div class="card-body">
        <label class="form-label mb-1">Select Drive</label>
        <select class="form-select" id="driveSelect"></select>
      </div>
    </div>

    <div id="eligibleCount" class="mb-2 text-muted small"></div>
    <div id="applicantsList"></div>
  </main>
</div>

<!-- Round / Decision modal -->
<div class="modal fade" id="actionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="actionModalTitle">Update Status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="actionModalAlert"></div>
        <p id="actionModalDesc" class="small text-muted"></p>
        <div class="mb-3">
          <label class="form-label">Feedback (optional)</label>
          <textarea class="form-control" id="actionFeedback" rows="2"></textarea>
        </div>
        <div id="packageFieldWrap" class="mb-2 d-none">
          <label class="form-label">Offered Package (LPA)</label>
          <input type="number" step="0.1" class="form-control" id="packageField">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-outline-danger" id="rejectActionBtn">Reject</button>
        <button type="button" class="btn btn-success" id="confirmActionBtn">Clear / Select</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/tpo/applicants.js"></script>
</body>
</html>
