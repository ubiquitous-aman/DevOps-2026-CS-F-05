<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">Students</h2>
    <div id="alertBox"></div>
    <div class="card section-card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-sm-5"><label class="form-label small fw-semibold mb-1" for="search">Search</label>
            <input type="text" class="form-control form-control-sm" id="search" placeholder="Name, roll number or email"></div>
          <div class="col-sm-3"><label class="form-label small fw-semibold mb-1" for="branchFilter">Branch</label>
            <select class="form-select form-select-sm" id="branchFilter"><option value="">All branches</option></select></div>
          <div class="col-sm-4"><label class="form-label small fw-semibold mb-1" for="placedFilter">Placement</label>
            <select class="form-select form-select-sm" id="placedFilter">
              <option value="">All</option><option value="placed">Placed</option><option value="unplaced">Not placed</option></select></div>
        </div>
        <div class="d-flex gap-2 flex-wrap mt-3">
          <button class="btn btn-sm btn-outline-success" id="exportStudentsBtn"><i class="bi bi-file-earmark-excel me-1"></i>Export CSV (current filters)</button>
          <button class="btn btn-sm btn-outline-primary" id="importStudentsBtn"><i class="bi bi-upload me-1"></i>Import students (CSV)</button>
          <input type="file" id="importFile" accept=".csv,text/csv" class="d-none">
          <span class="small text-muted align-self-center">CSV columns: name, email, phone, rollNumber, branch, batch — each student gets a temporary password.</span>
        </div>
      </div>
    </div>
    <div class="card section-card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle" id="studentsTable">
            <thead><tr><th>Name</th><th>Roll</th><th>Branch</th><th>Batch</th><th>CGPA</th><th>Backlogs</th><th>Placement</th><th></th></tr></thead>
            <tbody id="studentsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/validate.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/student-view.js"></script>
<script src="../js/tpo/students.js"></script>
</body>
</html>
