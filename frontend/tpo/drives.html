<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drives & Requirements | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h2 id="pageTitle" class="fw-bold text-primary-portal mb-0">Drives & Requirements</h2>
      <button class="btn btn-primary-portal btn-sm" data-bs-toggle="modal" data-bs-target="#driveModal" onclick="openCreateModal()">
        <i class="bi bi-plus-circle me-1"></i>New Drive
      </button>
    </div>
    <div id="alertBox"></div>
    <div id="drivesList" class="row g-3"></div>
  </main>
</div>

<!-- Create / Edit Drive Modal -->
<div class="modal fade" id="driveModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="driveModalTitle">New Drive</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalAlert"></div>
        <form id="driveForm">
          <input type="hidden" id="driveId">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Company</label>
              <select class="form-select" id="company" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Job Title</label>
              <input type="text" class="form-control" id="jobTitle" required>
            </div>
            <div class="col-12">
              <label class="form-label">Job Description</label>
              <textarea class="form-control" id="jobDescription" rows="2"></textarea>
            </div>
            <div class="col-md-4">
              <label class="form-label">Job Type</label>
              <select class="form-select" id="jobType">
                <option>Full-Time</option><option>Internship</option><option>Internship + PPO</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Package (LPA)</label>
              <input type="number" step="0.1" class="form-control" id="packageLPA" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Location</label>
              <input type="text" class="form-control" id="location">
            </div>
            <div class="col-md-6">
              <label class="form-label">Application Deadline</label>
              <input type="date" class="form-control" id="applicationDeadline" required>
            </div>
          </div>

          <hr class="my-3">
          <h6 class="fw-bold"><i class="bi bi-funnel me-1"></i>Eligibility Criteria</h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Eligible Branches (comma-separated, blank = all)</label>
              <input type="text" class="form-control" id="eligBranches" placeholder="CSE, IT, ECE">
            </div>
            <div class="col-md-6">
              <label class="form-label">Eligible Batch (Year)</label>
              <input type="number" class="form-control" id="eligBatch" placeholder="2026">
            </div>
            <div class="col-md-3">
              <label class="form-label">Min CGPA</label>
              <input type="number" step="0.1" class="form-control" id="eligCgpa" value="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Max Backlogs</label>
              <input type="number" class="form-control" id="eligBacklogs" value="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Min 10th %</label>
              <input type="number" step="0.1" class="form-control" id="eligTenth" value="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Min 12th %</label>
              <input type="number" step="0.1" class="form-control" id="eligTwelfth" value="0">
            </div>
          </div>

          <hr class="my-3">
          <div class="d-flex justify-content-between align-items-center">
            <h6 class="fw-bold mb-0"><i class="bi bi-list-ol me-1"></i>Recruitment Rounds / Timetable</h6>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addRoundRow()"><i class="bi bi-plus"></i> Add Round</button>
          </div>
          <div id="roundsContainer" class="mt-2"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary-portal" id="saveDriveBtn" onclick="saveDrive()">Save Drive</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/tpo/drives.js"></script>
</body>
</html>
