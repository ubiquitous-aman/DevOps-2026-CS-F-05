<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics | Placement Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="appNavbar"></div>
<div class="dashboard-shell">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main-content">
    <h2 id="pageTitle" class="mb-4 fw-bold text-primary-portal">Placement Statistics</h2>
    <div id="alertBox"></div>
    <div class="row g-3 mb-4" id="statCards"></div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card section-card">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-diagram-3 me-2"></i>Branch-wise Placement</h5>
            <div id="branchTable"></div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card section-card">
          <div class="card-body">
            <h5 class="card-title mb-3"><i class="bi bi-pie-chart me-2"></i>Application Outcomes</h5>
            <div id="outcomeChart"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-md-6">
        <div class="card stat-card"><div class="card-body">
          <div class="text-muted small">Average Package</div>
          <div class="stat-value" id="avgPkg">—</div>
        </div></div>
      </div>
      <div class="col-md-6">
        <div class="card stat-card"><div class="card-body">
          <div class="text-muted small">Highest Package</div>
          <div class="stat-value" id="highPkg">—</div>
        </div></div>
      </div>
    </div>

    <div class="card section-card mt-3">
      <div class="card-body">
        <h5 class="card-title mb-3"><i class="bi bi-megaphone me-2"></i>Notify Students</h5>
        <p class="text-muted small">Send a custom notification to selected students by roll number-matched search.</p>
        <form id="notifyForm" class="row g-2">
          <div class="col-md-4">
            <input type="text" class="form-control" id="notifyTitle" placeholder="Title" required>
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" id="notifyMessage" placeholder="Message" required>
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary-portal w-100" type="submit">Notify All</button>
          </div>
        </form>
        <div class="form-text">This sends the message to every registered student.</div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/tpo/statistics.js"></script>
</body>
</html>
